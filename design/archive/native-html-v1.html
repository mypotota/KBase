ymbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C4 1 1 12 7 17S22 17 20 3ZM4 21 16 9"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2Z M12 9v4M12 17h.01"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3ZM9 21v-8h6v8"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6ZM13 6l5 5"/></symbol>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const icon=(n,c='')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('浏览器存储不可用，当前修改仅保留在本次页面中')}}};
let page='editor',current='welcome',opened=['welcome','sync-note'],read=false,sourceTarget=null,saveTimer,activeBlock=null,conflicted=!store.get('kbase-conflict-resolved',false),syncing=false;
const docs=[{id:'welcome',name:'欢迎来到 KBase',folder:'开始使用',html:`<div class="doc-eyebrow"><span class="shortline"></span> YOUR IDEAS, ROOTED HERE</div><h1>欢迎来到 KBase</h1><div class="docmeta"><span>${icon('clock')} 今天更新</span><span>·</span><span>我的知识花园</span><span class="pill">入门指南</span></div><p class="intro block">让零散的想法，有一个安静的归处。<br>从一个文件夹开始，慢慢长成属于你的知识花园。</p><div class="callout">${icon('leaf')}<div><strong>本地优先，安心记录。</strong><br>你的每一篇文档，都是本地文件夹里真实的 Markdown 文件。<br>无需网络，也能让思考继续。</div></div><h2 id="section-1"><span class="num">01</span>从这里开始</h2><p class="block">KBase 把熟悉的文件夹，变成一个专注、轻盈的知识空间。左侧整理文档，中间自由书写，右侧随时掌握内容脉络。</p><ul class="block"><li><strong>整理你的项目</strong> — 用文件夹建立清晰的层级。</li><li><strong>自然地写作</strong> — 输入 <span class="badge">/</span> 插入标题、列表或代码块。</li><li><strong>在设备间流动</strong> — 连接自己的服务，让知识随身而行。</li></ul><div class="doc-rule"></div><h2 id="section-2"><span class="num">02</span>你的知识，你来掌控</h2><div class="principles"><div class="mini-card">${icon('folder')}<strong>文件即知识库</strong><p>打开已有文件夹即可开始。<br>不改变你的文件组织习惯。</p></div><div class="mini-card">${icon('sync')}<strong>思考自由流动</strong><p>本地保存与远端同步相互独立。<br>离线编辑，上线后从容同步。</p></div></div><h2 id="section-3"><span class="num">03</span>试着写下第一个想法</h2><p class="block" data-placeholder="输入内容，或输入 / 选择块类型">点击这里，写下今天值得留下的一个想法……</p><label class="check"><input type="checkbox"><span>创建我的第一篇文档</span></label><label class="check"><input type="checkbox"><span>整理一个属于自己的项目文件夹</span></label><label class="check"><input type="checkbox"><span>连接自己的同步服务器</span></label><h2 id="section-4"><span class="num">04</span>为长久的记录而设计</h2><p class="block">无需一次完成所有整理。先把想法留下，让它们在日常的阅读与回顾中慢慢连接。</p>`},
{id:'shortcuts',name:'常用操作与快捷键',folder:'开始使用',html:`<div class="doc-eyebrow">MAKE ROOM FOR YOUR FLOW</div><h1>常用操作与快捷键</h1><div class="docmeta">让工具跟上思考的速度</div><h2 id="section-1">写作与导航</h2><p class="block">⌘ / Ctrl + K：查找文件<br>⌘ / Ctrl + S：立即保存<br>⌘ / Ctrl + B：加粗所选文字<br>Esc：关闭弹层与菜单</p><h2 id="section-2">整理工作空间</h2><p class="block">拖动左侧分隔线调整文件树宽度，双击恢复默认。点击顶部面板图标收起侧栏，让注意力回到文字。</p><h2 id="section-3">插入新的内容</h2><p class="block">在段落中输入 /，选择段落、标题、列表、待办或代码块。</p>`},
{id:'design',name:'产品设计笔记',folder:'我的项目',html:`<div class="doc-eyebrow">PROJECT NOTES / 001</div><h1>产品设计笔记</h1><div class="docmeta">今天更新 · 我的项目</div><h2 id="section-1">设计的出发点</h2><p class="block">好的工具应该安静地退到内容后面。在这里，我们把可读性、确定性和长期可用放在第一位。</p><div class="callout">${icon('leaf')}<div>少一些打扰，多一些思考的空间。</div></div><h2 id="section-2">体验原则</h2><ul class="block"><li>保存状态清晰可见。</li><li>不让同步阻塞本地写作。</li><li>所有重要操作都有可恢复的路径。</li></ul><h2 id="section-3">接下来的工作</h2><label class="check"><input type="checkbox" checked><span>梳理桌面端的信息结构</span></label><label class="check"><input type="checkbox"><span>验证 Android 端的编辑流程</span></label>`},
{id:'sync-note',name:'同步方案',folder:'我的项目',html:`<div class="doc-eyebrow">TECHNICAL NOTES</div><h1>同步方案</h1><div class="docmeta">今天更新 · 我的项目</div><h2 id="section-1">本地优先</h2><p class="block">先将修改安全保存到本机，再加入同步队列。网络变化不会中断编辑。</p><h2 id="section-2">版本与冲突</h2><p class="block">每次修改携带基线版本。如果两台设备编辑了同一份基线，保留双方内容，交由用户对比合并。</p><div class="codebox block">save_local(document)\nqueue_sync(document, base_version)\nif remote.version != base_version:\n    preserve_both_versions()</div><h2 id="section-3">可追踪的执行过程</h2><p class="block">同步任务使用独立任务编号，客户端与服务端日志可以关联追踪。默认不记录文档正文或身份凭据。</p>`},
{id:'reading',name:'阅读摘记',folder:'日常记录',html:`<div class="doc-eyebrow">EVERYDAY INSPIRATION</div><h1>阅读摘记</h1><div class="docmeta">日常记录 · 持续积累</div><h2 id="section-1">把阅读变成自己的理解</h2><p class="block">记录让你停下来的那句话，也记录它为什么让你停下。</p><h2 id="section-2">今天的思考</h2><p class="block" data-placeholder="写下一段新的理解……">知识的价值，在于它如何改变我们观察世界的方式。</p>`}];
for(const d of docs){d.html=store.get('kbase-doc-'+d.id,d.html)}
for(const d of store.get('kbase-custom-docs',[])){if(!docs.some(x=>x.id===d.id))docs.push(d)}
const folders=['开始使用','我的项目','日常记录'];const collapsed=new Set();
function renderTree(){const filter=$('#filter').value.toLowerCase();$('#tree').innerHTML=folders.map(f=>{let list=docs.filter(d=>d.folder===f&&d.name.toLowerCase().includes(filter));if(!list.length)return '';return `<button class="tree-row" onclick="toggleFolder('${f}')">${icon(collapsed.has(f)?'right':'down','arrow')}${icon('folder')}<span>${f}</span><small>${list.length}</small></button><div class="children ${collapsed.has(f)&&!filter?'hidden':''}">${list.map(d=>`<button class="tree-row ${current===d.id?'active':''}" onclick="openDoc('${d.id}')">${icon('file')}<span>${escapeHtml(d.name)}</span>${d.id==='welcome'?'<small>↗</small>':''}</button>`).join('')}</div>`}).join('')+`<div style="margin:24px 0 0;padding:15px 9px;border-top:1px solid var(--line)"><button class="tree-row" onclick="newDocument()">${icon('plus')}新建文档</button><button class="tree-row" onclick="projectDialog()">${icon('folder')}打开其他项目</button></div>`}
function toggleFolder(f){collapsed.has(f)?collapsed.delete(f):collapsed.add(f);renderTree()}
function renderTabs(){const valid=opened.map(id=>docs.find(d=>d.id===id)).filter(Boolean);$('#tabs').innerHTML=valid.map(d=>`<button class="tab ${current===d.id?'selected':''}" onclick="openDoc('${d.id}')">${icon('file')}${escapeHtml(d.name)}<span class="close" role="button" aria-label="关闭 ${escapeHtml(d.name)}" onclick="event.stopPropagation();closeTab('${d.id}')">×</span></button>`).join('')+`<button class="icon" style="align-self:center;margin-left:5px" title="新建文档" onclick="newDocument()">${icon('plus')}</button>`}
function closeTab(id){opened=opened.filter(x=>x!==id);if(current===id){if(!opened.length)opened=['welcome'];openDoc(opened.at(-1))}renderTabs()}
function persistDoc(){const d=docs.find(d=>d.id===current);if(!d||page!=='editor')return;d.html=$('#document').innerHTML;store.set('kbase-doc-'+d.id,d.html);store.set('kbase-custom-docs',docs.filter(d=>d.id.startsWith('new-')));$('#saveStatus').innerHTML=icon('check')+' 本地已保存';updateCount()}
function queueSave(){clearTimeout(saveTimer);$('#saveStatus').innerHTML=icon('clock')+' 正在保存…';saveTimer=setTimeout(persistDoc,700)}
function renderDoc(){const d=docs.find(d=>d.id===current);$('#document').innerHTML=d.html;$('#breadcrumb').textContent=d.folder;$('#projectPath').textContent='我的知识花园 / '+d.folder;$('#document').querySelectorAll('.block').forEach(el=>{el.contentEditable=String(!read);el.setAttribute('spellcheck','false')});$('#document').querySelectorAll('input[type=checkbox]').forEach(el=>el.disabled=read);$('#document').querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{el.toggleAttribute('checked',el.checked);queueSave()}));renderOutline();updateCount();$('#readLabel').textContent=read?'阅读模式':'块编辑';$('#modeButton').title=read?'切换为块编辑':'切换为阅读模式';$('#modeButton').innerHTML=icon(read?'edit':'file');$('#editToolbar').classList.toggle('hidden',read)}
function renderOutline(){$('#outlineItems').innerHTML=[...$('#document').querySelectorAll('h2')].map((h,i)=>{h.id='section-'+(i+1);return `<button class="item ${i===0?'current':''}" onclick="scrollSection('${h.id}',this)">${escapeHtml(h.textContent.replace(/^0\d/,''))}</button>`}).join('')}
function scrollSection(id,btn){$('#'+id)?.scrollIntoView({behavior:'smooth',block:'start'});$$('.outline .item').forEach(e=>e.classList.remove('current'));btn.classList.add('current')}
function updateCount(){$('#wordCount').textContent=$('#document').innerText.replace(/\s/g,'').length.toLocaleString()+' 字'}
function openDoc(id){if(page==='editor')persistDoc();current=id;if(!opened.includes(id))opened.push(id);navigate('editor',false);renderDoc();renderTabs();renderTree();$('#editorScroll').scrollTop=0;if(isMobile())toggleSidebar(false)}
function isMobile(){return innerWidth<=700||document.body.classList.contains('phone')}
let sideHidden=false,outlineHidden=false;
function toggleSidebar(force){if(isMobile()){const open=typeof force==='boolean'?force:!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#mask').classList.toggle('show',open)}else{sideHidden=typeof force==='boolean'?!force:!sideHidden;$('#sidebar').classList.toggle('hidden',sideHidden)}}
function toggleOutline(){if(isMobile()||innerWidth<950){$('#outline').classList.toggle('show-mobile')}else{outlineHidden=!outlineHidden;$('#outline').classList.toggle('hidden',outlineHidden)}}
function toggleRead(){if(page!=='editor')return;persistDoc();read=!read;renderDoc();toast(read?'已切换阅读模式':'已切换块编辑，点击段落开始书写')}
function setDevice(phone){document.body.classList.toggle('phone',phone);$('#desktopBtn').classList.toggle('selected',!phone);$('#phoneBtn').classList.toggle('selected',phone);$('#sidebar').classList.remove('hidden','open');$('#mask').classList.remove('show');$('#outline').classList.remove('show-mobile');sideHidden=false}
function setTheme(theme){const resolved=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;document.documentElement.dataset.theme=resolved;store.set('kbase-theme',theme);$('#themeLabel').textContent=resolved==='dark'?'浅色':'深色';$('#railTheme').innerHTML=icon(resolved==='dark'?'moon':'sun');if(page==='settings')renderSettings()}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
function toast(msg){clearTimeout(window.toastTimer);$('#toastRoot').innerHTML=`<div class="toast">${icon('check')}<span>${escapeHtml(msg)}</span></div>`;window.toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',3500)}
let lastFocus=null;
function modal(title,desc,body,foot='',width){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal" style="${width?'width:'+width+'px':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-head"><div><h2>${title}</h2><p>${desc}</p></div><button class="icon" title="关闭" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});setTimeout(()=>$('#modalRoot input, #modalRoot textarea, #modalRoot button')?.focus(),30)}
function closeModal(){$('#modalRoot').innerHTML='';lastFocus?.focus()}
function newDocument(){modal('新的想法，从这里开始','文档会保存在所选文件夹中。此原型仅存入当前浏览器。',`<form id="newDocForm"><div class="field"><label for="docName">文档名称</label><input id="docName" placeholder="例如：一个新的想法" required maxlength="80"></div><div class="field"><label for="docFolder">所在文件夹</label><select id="docFolder">${folders.map(f=>`<option>${f}</option>`).join('')}</select></div></form>`,`<button class="button" onclick="closeModal()">取消</button><button class="button primary" onclick="createDoc()">创建文档 ${icon('arrow')}</button>`,420);$('#newDocForm').addEventListener('submit',e=>{e.preventDefault();createDoc()})}
function createDoc(){const name=$('#docName').value.trim();if(!name){$('#docName').focus();return}const id='new-'+Date.now();docs.push({id,name,folder:$('#docFolder').value,html:`<div class="doc-eyebrow">A NEW THOUGHT</div><h1>${escapeHtml(name)}</h1><div class="docmeta">刚刚创建 · 本地文档</div><p class="block" data-placeholder="写下你的想法，或输入 / 插入内容"></p>`});store.set('kbase-custom-docs',docs.filter(d=>d.id.startsWith('new-')));closeModal();openDoc(id);$('#document .block')?.focus();toast('文档已创建')}
function navigate(target,save=true){if(save&&page==='editor')persistDoc();page=target;$$('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===page));$('#editorView').classList.toggle('hidden',page!=='editor');$('#tabs').classList.toggle('hidden',page!=='editor');$('#pageView').classList.toggle('hidden',page==='editor');if(page==='sync')renderSync();if(page==='logs')renderLogs();if(page==='settings')renderSettings();if(page==='editor'){renderTabs();$('#breadcrumb').textContent=docs.find(d=>d.id===current).folder}else{$('#breadcrumb').textContent={sync:'同步中心',logs:'日志中心',settings:'设置'}[page]}if(isMobile())toggleSidebar(false)}
function renderSync(){$('#pageView').innerHTML=`<div class="page-inner"><div class="page-kicker">CONNECTED, ON YOUR TERMS</div><div class="page-heading"><div><h1>让知识，在设备间流动。</h1><p class="desc">本地安心记录，同步从容发生。</p></div><button class="button primary" id="syncNow" onclick="runSync()" ${syncing?'disabled':''}>${icon('sync',syncing?'spin':'')} ${syncing?'同步中…':'立即同步'}</button></div><div class="panel server"><div class="server-icon">${icon('cloud')}</div><div class="server-details"><strong>我的同步服务器 <span class="badge">演示连接</span></strong><p>${escapeHtml(store.get('kbase-server','https://sync.example.com'))}</p></div><button class="button" onclick="serverDialog()">配置</button></div><div class="stats"><div class="stat"><span>待同步</span><strong id="pendingCount">${syncing?'2':'0'} <span>个文件</span></strong></div><div class="stat"><span>需要处理</span><strong style="color:${conflicted?'#b28c55':'var(--accent)'}">${conflicted?'1':'0'} <span>个冲突</span></strong></div><div class="stat"><span>已连接设备</span><strong>2 <span>台</span></strong></div></div>${conflicted?`<div class="warning">${icon('alert')}<span>「产品设计笔记」存在两个版本，双方内容已保留。</span><button onclick="conflictDialog()">查看冲突 →</button></div>`:''}<div class="section-label">我的知识花园<span>上次同步：刚刚</span></div><div class="panel" style="padding-top:2px;padding-bottom:2px"><div class="task">${icon('file')}<div class="detail"><strong>欢迎来到 KBase.md</strong><p>开始使用 / 欢迎来到 KBase.md · 4.2 KB</p></div><span class="badge">${icon('check')} 已同步</span></div><div class="task">${icon('file')}<div class="detail"><strong>产品设计笔记.md</strong><p>我的项目 / 产品设计笔记.md · 2.1 KB</p></div><button class="badge" style="${conflicted?'background:#fbf1e0;color:#b28c55':''}" onclick="${conflicted?'conflictDialog()':"toast('双方版本已保留，冲突已解决')"}">${conflicted?'需要合并':'已解决'} ${icon(conflicted?'alert':'check')}</button></div><div class="task">${icon('file')}<div class="detail"><strong>同步方案.md</strong><p>我的项目 / 同步方案.md · 1.8 KB</p></div><span class="badge">${icon('check')} 已同步</span></div></div><div class="section-label">设备</div><div class="panel" style="padding-top:0;padding-bottom:0"><div class="task">${icon('monitor')}<div class="detail"><strong>我的电脑 <span class="muted small">· 当前设备</span></strong><p>桌面客户端 · 刚刚活跃</p></div><span class="dot"></span></div><div class="task">${icon('phone')}<div class="detail"><strong>我的 Android</strong><p>移动客户端 · 12 分钟前活跃</p></div><span class="small muted">前台自动同步</span></div></div><p class="small muted">原型中的服务器、设备与传输状态均为交互演示，不会实际上传文件。</p></div>`}
function runSync(){if(syncing)return;syncing=true;$('#syncTop').innerHTML=icon('sync','spin')+' 同步中';renderSync();addLog('INFO','同步','开始执行手动同步，扫描待处理文件');setTimeout(()=>{syncing=false;$('#syncTop').innerHTML=icon('cloud')+' 已同步';addLog('INFO','同步','同步完成，2 个文件已检查；现有冲突保持待处理');if(page==='sync')renderSync();toast(conflicted?'同步检查完成，仍有 1 个冲突待处理':'同步完成，所有文件已是最新版本')},1700)}
function serverDialog(){modal('连接你的同步服务器','自建 Docker 服务 · 当前为连接流程演示',`<div class="field"><label for="serverUrl">服务器地址</label><input id="serverUrl" type="url" placeholder="https://sync.example.com" value="${escapeHtml(store.get('kbase-server','https://sync.example.com'))}"></div><div class="field"><label for="pairCode">设备配对码</label><input id="pairCode" autocomplete="off" placeholder="输入服务器生成的配对码"></div><p class="small muted">此原型只保存服务器地址，不保存配对码，也不会发送连接请求。</p>`,`<button class="button" onclick="closeModal()">取消</button><button class="button primary" onclick="saveServer()">模拟连接</button>`,440)}
function saveServer(){let url;try{url=new URL($('#serverUrl').value);if(url.protocol!=='https:')throw Error()}catch{toast('请输入有效的 HTTPS 服务器地址');return}store.set('kbase-server',url.origin);closeModal();if(page==='sync')renderSync();toast('连接配置已保存（演示模式）')}
function conflictDialog(){modal('保留每一个版本，再做决定','产品设计笔记.md · 两台设备修改了同一基线版本',`<div class="warning" style="margin-bottom:20px">${icon('lock')}<span>无论如何处理，双方原始版本都会保留。此处使用演示文案。</span></div><div class="versions"><div class="version"><header><span>${icon('monitor')} 本机版本</span><span class="muted">10:42</span></header><p>设计原则<br>让记录变得简单，让知识随时可用。<del>第一版先完善桌面端的写作体验。</del><br>保持本地文件的独立性。</p></div><div class="version"><header><span>${icon('phone')} Android 版本</span><span class="muted">10:48</span></header><p>设计原则<br>让记录变得简单，让知识随时可用。<ins>第一版同时验证桌面与移动端的编辑流程。</ins><br>保持本地文件的独立性。</p></div></div><p class="small muted" style="margin-top:17px">可以采用其中一个版本，或者手动编辑合并结果。</p>`,`<button class="button" onclick="resolveConflict('本机')">保留本机</button><button class="button" onclick="resolveConflict('远端')">采用远端</button><button class="button primary" onclick="mergeDialog()">编辑合并结果 ${icon('arrow')}</button>`)}
function mergeDialog(){modal('编辑合并结果','确认前请检查两个版本中的重要修改。',`<div class="field"><label for="mergeContent">合并后的 Markdown</label><textarea id="mergeContent" rows="10"># 产品设计笔记\n\n## 设计原则\n\n让记录变得简单，让知识随时可用。\n\n第一版完善桌面端写作体验，同时验证移动端的编辑流程。\n\n保持本地文件的独立性。</textarea></div><p class="small muted">保存后可在“我的项目 / 产品设计笔记”中查看，原版本可导出。</p>`,`<button class="button" onclick="conflictDialog()">返回对比</button><button class="button primary" onclick="resolveConflict('合并')">保存并解决冲突</button>`)}
function markdownHtml(text){return text.split('\n').map(line=>line.startsWith('## ')?`<h2>${escapeHtml(line.slice(3))}</h2>`:line.startsWith('# ')?`<h1>${escapeHtml(line.slice(2))}</h1>`:line.trim()?`<p class="block">${escapeHtml(line)}</p>`:'').join('')}
function resolveConflict(choice){const d=docs.find(d=>d.id==='design');store.set('kbase-conflict-backup',d.html);store.set('kbase-conflict-versions',{local:'第一版先完善桌面端的写作体验。',remote:'第一版同时验证桌面与移动端的编辑流程。'});const text=choice==='合并'?$('#mergeContent').value:`# 产品设计笔记\n\n## 设计原则\n\n让记录变得简单，让知识随时可用。\n\n${choice==='本机'?'第一版先完善桌面端的写作体验。':'第一版同时验证桌面与移动端的编辑流程。'}\n\n保持本地文件的独立性。`;d.html=markdownHtml(text);store.set('kbase-doc-design',d.html);conflicted=false;store.set('kbase-conflict-resolved',true);addLog('INFO','同步','冲突已处理，保留双方演示快照，选择：'+choice);closeModal();if(page==='sync')renderSync();if(page==='editor'&&current==='design')renderDoc();toast('已保存'+choice+'版本，原始内容已保留')}
let logs=[{time:'10:48:32',level:'WARN',module:'同步',msg:'检测到版本分歧，已保留双方内容',id:'sync-demo-004'},{time:'10:48:31',level:'INFO',module:'同步',msg:'下载远端变更，发现 1 个文件需要检查',id:'sync-demo-004'},{time:'10:48:30',level:'INFO',module:'连接',msg:'演示连接就绪，等待同步任务',id:'conn-demo-002'},{time:'10:42:18',level:'INFO',module:'文件',msg:'产品设计笔记.md 已原子写入',id:'file-demo-008'},{time:'10:42:17',level:'ERROR',module:'连接',msg:'模拟请求超时，已在下一次重试中恢复',id:'conn-demo-001'},{time:'10:42:16',level:'INFO',module:'编辑',msg:'本地恢复草稿已更新',id:'edit-demo-005'},{time:'10:40:01',level:'INFO',module:'系统',msg:'项目索引完成，共发现 5 篇文档',id:'app-demo-001'}];
function addLog(level,module,msg){logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),level,module,msg,id:'demo-'+Date.now()})}
function renderLogs(){$('#pageView').innerHTML=`<div class="page-inner"><div class="page-kicker">EVERY DETAIL, TRACEABLE</div><div class="page-heading"><div><h1>每一步，都有迹可循。</h1><p class="desc">定位问题，从一条清晰的日志开始。</p></div><button class="button" onclick="exportLogs()">${icon('download')} 导出日志</button></div><div class="logfilters"><input id="logSearch" placeholder="搜索事件或任务编号…" aria-label="搜索日志" oninput="filterLogs()"><select id="logLevel" aria-label="日志级别" onchange="filterLogs()"><option value="">全部级别</option><option>INFO</option><option>WARN</option><option>ERROR</option></select><select id="logModule" aria-label="日志模块" onchange="filterLogs()"><option value="">全部模块</option>${['同步','连接','文件','编辑','系统'].map(m=>`<option>${m}</option>`).join('')}</select></div><div class="panel" style="padding:8px 16px"><div class="logrow muted" style="cursor:default"><span>时间</span><span>级别</span><span class="module">模块</span><span>事件摘要</span><span></span></div><div id="logRows"></div></div><div class="callout">${icon('lock')}<div>默认不记录文档正文、访问令牌或密码。导出前自动移除敏感字段。<br>此页为演示日志，可点击每条记录查看关联事件。</div></div></div>`;filterLogs()}
function filterLogs(){const query=$('#logSearch').value.toLowerCase(),level=$('#logLevel').value,module=$('#logModule').value;const filtered=logs.filter(l=>(!level||l.level===level)&&(!module||l.module===module)&&(!query||(l.msg+l.id).toLowerCase().includes(query)));$('#logRows').innerHTML=filtered.map(l=>`<div class="logrow" tabindex="0" role="button" onclick="logDetail('${l.id}')" onkeydown="if(event.key==='Enter')logDetail('${l.id}')"><span class="logtime">${l.time}</span><span class="level ${l.level.toLowerCase()}">${l.level}</span><span class="module muted">${l.module}</span><span>${escapeHtml(l.msg)}</span>${icon('right')}</div>`).join('')||'<p class="muted" style="padding:25px">没有符合条件的日志。</p>'}
function logDetail(id){const l=logs.find(l=>l.id===id);modal('事件详情','演示日志 · 关联链路可追踪',`<div class="codebox">时间：${l.time}\n级别：${l.level}\n模块：${l.module}\n任务：${l.id}\n\n${escapeHtml(l.msg)}\n\n建议：${l.level==='ERROR'?'该演示错误已恢复；实际故障可检查网络与服务状态。':l.level==='WARN'?'打开同步中心，检查并处理版本冲突。':'当前事件无需额外处理。'}</div>`,`<button class="button" onclick="exportLogs()">${icon('download')} 导出诊断日志</button><button class="button primary" onclick="closeModal()">完成</button>`,530)}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportLogs(){download('kbase-demo-diagnostics.json',JSON.stringify({mode:'prototype',version:'0.1',logs},null,2),'application/json');toast('演示诊断日志已导出')}
function renderSettings(){const theme=store.get('kbase-theme','light');$('#pageView').innerHTML=`<div class="page-inner"><div class="page-kicker">MAKE YOURSELF AT HOME</div><h1>你的空间，你的习惯。</h1><p class="desc">调整到恰到好处，然后专注于内容。</p><div class="section-label">外观</div><div class="panel"><div class="setting-row"><div><strong>界面主题</strong><p>选择浅色、深色，或跟随系统变化。</p></div><div class="theme-choices">${[['light','浅色'],['dark','深色'],['system','系统']].map(([v,n])=>`<button class="${theme===v?'selected':''}" onclick="setTheme('${v}')">${n}</button>`).join('')}</div></div><div class="setting-row"><div><strong>正文字号</strong><p>适合长时间阅读的文字大小。</p></div><select aria-label="正文字号" onchange="setFontSize(this.value)">${[13,14,15,16,18].map(n=>`<option value="${n}" ${store.get('kbase-font',13)===n?'selected':''}>${n}px</option>`).join('')}</select></div><div class="setting-row"><div><strong>正文全宽</strong><p>让编辑区域使用全部可用宽度。</p></div><button class="switch ${store.get('kbase-wide',false)?'on':''}" role="switch" aria-checked="${store.get('kbase-wide',false)}" aria-label="正文全宽" onclick="toggleSetting(this,'wide')"></button></div></div><div class="section-label">编辑与同步</div><div class="panel"><div class="setting-row"><div><strong>自动保存</strong><p>停止输入约 800ms 后保存；快捷键立即保存。</p></div><span class="badge">始终开启</span></div><div class="setting-row"><div><strong>前台自动同步</strong><p>正式客户端在启动、回到前台与保存后同步。</p></div><button class="switch ${store.get('kbase-autosync',true)?'on':''}" role="switch" aria-checked="${store.get('kbase-autosync',true)}" aria-label="前台自动同步" onclick="toggleSetting(this,'autosync')"></button></div><div class="setting-row"><div><strong>同步服务器</strong><p>连接你的自建服务，管理设备间的同步。</p></div><button class="button" onclick="serverDialog()">配置连接</button></div></div><div class="section-label">诊断与数据</div><div class="panel"><div class="setting-row"><div><strong>导出诊断日志</strong><p>仅包含演示事件，不包含文档正文。</p></div><button class="button" onclick="exportLogs()">${icon('download')} 导出</button></div><div class="setting-row"><div><strong>导出当前文档</strong><p>将原型内的内容下载为 Markdown 文件。</p></div><button class="button" onclick="exportDoc()">${icon('download')} 导出</button></div><div class="setting-row"><div><strong>恢复演示数据</strong><p>清除当前浏览器中的原型修改与布局偏好。</p></div><button class="button" style="color:var(--danger)" onclick="resetDialog()">重置</button></div></div></div>`}
function toggleSetting(btn,key){const value=!btn.classList.contains('on');store.set('kbase-'+key,value);btn.classList.toggle('on',value);btn.setAttribute('aria-checked',value);applyPrefs();if(key==='autosync')toast('偏好已保存；此原型不执行真实后台同步')}
function setFontSize(value){store.set('kbase-font',Number(value));applyPrefs()}
function applyPrefs(){let el=$('#prefs');if(!el){el=document.createElement('style');el.id='prefs';document.head.append(el)}el.textContent=`.document p,.document li{font-size:${store.get('kbase-font',13)}px}.document{${store.get('kbase-wide',false)?'max-width:none;':''}}`}
function resetDialog(){modal('恢复原型的初始状态？','此操作只清理当前浏览器的 KBase 演示数据。','<p>你在原型中新建的文档、编辑内容与偏好将被清除。建议先导出需要保留的文档。</p>',`<button class="button" onclick="closeModal()">取消</button><button class="button primary" onclick="resetDemo()">确认重置</button>`,440)}
function resetDemo(){for(const key of Object.keys(localStorage)){if(key.startsWith('kbase-'))localStorage.removeItem(key)}location.reload()}
function projectDialog(){modal('我的知识花园','本地文件夹，就是你的知识空间。',`<div class="server"><div class="server-icon">${icon('folder')}</div><div class="server-details"><strong>我的知识花园</strong><p>${docs.length} 篇文档 · 演示项目</p></div><span class="badge">当前项目</span></div><div class="doc-rule"></div><p class="muted" style="font-size:12px;line-height:1.9">正式客户端会通过系统文件选择器打开本地文件夹。此 HTML 原型使用浏览器本地存储，供评审界面与交互，不会读取你的磁盘文件。</p>`,`<button class="button" onclick="closeModal();serverDialog()">从同步服务连接</button><button class="button primary" onclick="closeModal();newDocument()">新建文档 ${icon('plus')}</button>`,510)}
function documentMenu(){if(page!=='editor'){toast('请先打开一篇文档');return}modal('文档操作',docs.find(d=>d.id===current).name,`<div style="display:grid;gap:10px"><button class="button" onclick="closeModal();sourceDialog()">${icon('code')} 查看 / 编辑 Markdown 源码</button><button class="button" onclick="exportDoc()">${icon('download')} 导出为 Markdown</button><button class="button" onclick="exportOriginal()">${icon('clock')} 导出双方冲突版本备份</button></div>`,null,420)}
function toMarkdown(){const root=$('#document').cloneNode(true);root.querySelectorAll('.doc-eyebrow,.docmeta,.num').forEach(e=>e.remove());return [...root.children].map(el=>{const text=el.innerText||el.textContent;if(el.tagName==='H1')return '# '+text;if(el.tagName==='H2')return '## '+text;if(el.tagName==='UL')return [...el.querySelectorAll('li')].map(li=>'- '+li.textContent).join('\n');if(el.classList.contains('codebox'))return '```\n'+text+'\n```';if(el.classList.contains('check'))return '- ['+(el.querySelector('input').checked?'x':' ')+'] '+el.querySelector('span').textContent;if(el.classList.contains('doc-rule'))return '---';return text}).join('\n\n')}
function exportDoc(){const d=docs.find(d=>d.id===current);download(d.name+'.md',toMarkdown());toast('Markdown 文档已导出')}
function exportOriginal(){const original=store.get('kbase-conflict-backup',null);if(!original){toast('尚无合并前副本，请先处理一次演示冲突');return}download('产品设计笔记-冲突备份.json',JSON.stringify({localHtml:original,versions:store.get('kbase-conflict-versions',{})},null,2),'application/json');toast('双方冲突版本与合并前副本已导出')}
function sourceDialog(){if(page!=='editor')return;sourceTarget=current;modal('Markdown 源码','原型支持基础标题与段落转换；复杂格式请先导出备份。',`<textarea class="source" id="sourceContent" aria-label="Markdown 源码">${escapeHtml(toMarkdown())}</textarea>`,`<button class="button" onclick="closeModal()">取消</button><button class="button primary" onclick="saveSource()">保存源码</button>`)}
function saveSource(){const d=docs.find(d=>d.id===sourceTarget);d.html=markdownHtml($('#sourceContent').value);store.set('kbase-doc-'+d.id,d.html);closeModal();renderDoc();persistDoc();toast('源码已保存')}
function showAbout(){modal('KBase','留住每一个想法。',`<div style="text-align:center;padding:18px"><span style="display:inline-grid;margin:0 auto 20px" class="brand">k.</span><p style="font-size:17px">一个安静、自由的知识空间。</p><p class="muted">本地文件 · 块编辑 · 自建同步</p><span class="badge">UI 交互原型 · 01</span></div>`,`<button class="button primary" onclick="closeModal()">开始探索</button>`,420)}
function reviewDialog(){modal('这是一份可以动手体验的设计稿','DESIGN PREVIEW 01 · 供 UI 敲版使用',`<div style="font-size:12px;line-height:2"><strong>建议按这个顺序体验</strong><ol><li>切换文件、新建文档，点击段落直接编辑。</li><li>输入 / 插入块，勾选待办，切换阅读模式。</li><li>拖动左右分隔线，双击恢复默认尺寸。</li><li>切换深色主题和移动视图，检查阅读与触控体验。</li><li>进入同步中心，点击“查看冲突”，完成一次合并。</li><li>打开日志中心，筛选错误并查看事件详情。</li></ol><div class="callout" style="margin-bottom:0">${icon('leaf')}<div>HTML 原型采用 shadcn/ui 的控件与交互风格；正式 React 版本将使用真实 shadcn/ui 组件。块编辑、文件与同步在此用于体验验证；目前不连接真实磁盘或后端。编辑内容和外观偏好保存在当前浏览器，切换域名或浏览器不会自动同步。</div></div></div>`,`<button class="button primary" onclick="closeModal()">开始体验 ${icon('arrow')}</button>`)}
function openSlash(){if(read||page!=='editor')return;activeBlock=$('#document .block:focus')||activeBlock||$('#document .block:last-of-type');const rect=activeBlock?.getBoundingClientRect();const x=Math.min(Math.max(rect?.left||200,10),innerWidth-235),y=Math.min(Math.max(rect?.bottom||200,10),innerHeight-330);$('#slashRoot').innerHTML=`<div class="slash" style="left:${x}px;top:${y}px"><div class="small muted">插入内容块</div>${[['p','段落','edit'],['h2','二级标题','file'],['ul','项目列表','list'],['check','待办事项','check'],['code','代码块','code']].map(([type,label,i])=>`<button onclick="insertBlock('${type}')">${icon(i)}${label}</button>`).join('')}</div>`}
function insertBlock(type){const block=activeBlock;const el=document.createElement(type==='h2'?'h2':type==='ul'?'ul':type==='check'?'label':type==='code'?'div':'p');if(block&&block.textContent.endsWith('/'))block.textContent=block.textContent.slice(0,-1);if(type==='check'){el.className='check';el.innerHTML='<input type="checkbox"><span contenteditable="true">新的待办事项</span>';el.querySelector('input').addEventListener('change',e=>{e.target.toggleAttribute('checked',e.target.checked);queueSave()})}else{el.className='block'+(type==='code'?' codebox':'');el.contentEditable='true';el.innerHTML=type==='ul'?'<li>新的列表项</li>':type==='h2'?'新的标题':type==='code'?'// 在这里输入代码':'';el.dataset.placeholder='写下你的想法…'}if(block)block.after(el);else $('#document').append(el);$('#slashRoot').innerHTML='';el.focus();activeBlock=el;queueSave();renderOutline()}
$('#filter').addEventListener('input',renderTree);
$('#document').addEventListener('input',e=>{activeBlock=e.target.closest('.block');queueSave();if(e.data==='/')openSlash()});$('#document').addEventListener('focusin',e=>{if(e.target.closest('.block'))activeBlock=e.target.closest('.block')});$('#document').addEventListener('paste',e=>{if(read)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#slashRoot').innerHTML='';toggleSidebar(false)}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(page==='editor'){persistDoc();toast('已保存到当前浏览器')}}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(isMobile())toggleSidebar(true);else if(sideHidden)toggleSidebar(true);$('#filter').focus()}if(e.key==='Tab'&&$('#overlay')){const els=[...$('#overlay').querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.slash')&&!e.target.closest('[contenteditable]'))$('#slashRoot').innerHTML=''});
function initResize(id,key,min,max,def,reverse=false){const el=$('#'+id);let origin,start;document.documentElement.style.setProperty('--'+key,store.get('kbase-'+key,def)+'px');el.addEventListener('pointerdown',e=>{origin=e.clientX;start=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--'+key));el.setPointerCapture(e.pointerId);el.classList.add('dragging');document.body.style.userSelect='none'});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const value=Math.min(max,Math.max(min,start+(e.clientX-origin)*(reverse?-1:1)));document.documentElement.style.setProperty('--'+key,value+'px')});const stop=()=>{el.classList.remove('dragging');document.body.style.userSelect='';store.set('kbase-'+key,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--'+key)))};el.addEventListener('pointerup',stop);el.addEventListener('lostpointercapture',stop);el.addEventListener('dblclick',()=>{document.documentElement.style.setProperty('--'+key,def+'px');store.set('kbase-'+key,def)});el.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let value=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--'+key))+(e.key==='ArrowRight'?10:-10)*(reverse?-1:1);value=Math.min(max,Math.max(min,value));document.documentElement.style.setProperty('--'+key,value+'px');store.set('kbase-'+key,value)}})}
initResize('sideResizer','side',200,480,254);initResize('outlineResizer','outline',200,360,224,true);setTheme(store.get('kbase-theme','light'));applyPrefs();renderTree();renderTabs();renderDoc();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(store.get('kbase-theme','light')==='system')setTheme('system')});window.addEventListener('beforeunload',()=>{if(page==='editor')persistDoc()});
</script>
</body></html>
