 Ctrl + B：加粗所选文字<br>Esc：关闭弹层与菜单</p><h2 id="section-2">整理工作空间</h2><p class="block">拖动左侧分隔线调整文件树宽度，双击恢复默认。点击顶部面板图标收起侧栏，让注意力回到文字。</p><h2 id="section-3">插入新的内容</h2><p class="block">在段落中输入 /，选择段落、标题、列表、待办或代码块。</p>'},{id:"design",name:"产品设计笔记",folder:"我的项目",html:'<div class="doc-eyebrow">PROJECT NOTES / 001</div><h1>产品设计笔记</h1><div class="docmeta">今天更新 · 我的项目</div><h2 id="section-1">设计的出发点</h2><p class="block">好的工具应该安静地退到内容后面。在这里，我们把可读性、确定性和长期可用放在第一位。</p><div class="callout"><svg><use href="#i-leaf"/></svg><div>少一些打扰，多一些思考的空间。</div></div><h2 id="section-2">体验原则</h2><ul class="block"><li>保存状态清晰可见。</li><li>不让同步阻塞本地写作。</li><li>所有重要操作都有可恢复的路径。</li></ul><h2 id="section-3">接下来的工作</h2><label class="check"><input type="checkbox" checked><span>梳理桌面端的信息结构</span></label><label class="check"><input type="checkbox"><span>验证 Android 端的编辑流程</span></label>'},{id:"sync-note",name:"同步方案",folder:"我的项目",html:`<div class="doc-eyebrow">TECHNICAL NOTES</div><h1>同步方案</h1><div class="docmeta">今天更新 · 我的项目</div><h2 id="section-1">本地优先</h2><p class="block">先将修改安全保存到本机，再加入同步队列。网络变化不会中断编辑。</p><h2 id="section-2">版本与冲突</h2><p class="block">每次修改携带基线版本。如果两台设备编辑了同一份基线，保留双方内容，交由用户对比合并。</p><div class="codebox block">save_local(document)
