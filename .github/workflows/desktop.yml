name: macOS first — checks and unsigned builds
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'server/**', 'scripts/**', 'package.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['web/**', 'server/**', 'scripts/**', 'package.json', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm test --prefix server
      - run: npm run build --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e --prefix web
  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - run: npm ci --prefix web
      - run: cargo test --manifest-path web/src-tauri/Cargo.toml --locked --no-default-features
      - run: npm run desktop:mac
      - uses: actions/upload-artifact@v4
        with:
          name: KBase-macOS-universal-unsigned
          if-no-files-found: error
          path: |
            web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            web/src-tauri/target/universal-apple-darwin/release/bundle/SHA256SUMS.txt
  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci --prefix web
      - run: cargo test --manifest-path web/src-tauri/Cargo.toml --locked --no-default-features
      - run: npm run desktop:build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: KBase-${{ runner.os }}-unsigned
          path: web/src-tauri/target/release/bundle/
